<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>ログイン | ToDo</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
		  rel="stylesheet"
		  integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
		  crossorigin="anonymous">
</head>
<body class="bg-light">
<main class="container py-5" style="max-width: 28rem">
	<h1 class="h2 mb-4">ToDoにログイン</h1>
	<div th:if="${param.error}" class="alert alert-danger" role="alert">
		ユーザー名またはパスワードが正しくありません。
	</div>
	<div th:if="${param.logout}" class="alert alert-success" role="status">
		ログアウトしました。
	</div>
	<div th:if="${param.registered}" class="alert alert-success" role="status">
		アカウントを作成しました。新しいユーザー名とパスワードでログインしてください。
	</div>
	<form method="post" th:action="@{/login}">
		<div class="mb-3">
			<label for="username" class="form-label">ユーザー名</label>
			<input id="username" name="username" type="text" class="form-control"
				   autocomplete="username" required autofocus>
		</div>
		<div class="mb-4">
			<label for="password" class="form-label">パスワード</label>
			<input id="password" name="password" type="password" class="form-control"
				   autocomplete="current-password" required>
		</div>
		<button type="submit" class="btn btn-primary w-100">ログイン</button>
	</form>
	<p class="text-center mt-3 mb-0">アカウントをお持ちでない方は <a th:href="@{/register}">新規登録</a></p>
</main>
</body>
</html>
