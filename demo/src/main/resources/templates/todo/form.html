<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>ToDo新規登録</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
		  rel="stylesheet"
		  integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
		  crossorigin="anonymous">
</head>
<body>
<main class="container py-5">
	<h1 class="h2 mb-4">ToDo新規登録</h1>

	<form method="post" th:action="@{/todo/confirm}" th:object="${todoForm}">
		<div class="mb-3">
			<label for="author" class="form-label">作成者</label>
			<input type="text" class="form-control" id="author" th:field="*{author}">
			<div class="text-danger" th:if="${#fields.hasErrors('author')}" th:errors="*{author}"></div>
		</div>
		<div class="mb-3">
			<label for="title" class="form-label">タイトル</label>
			<input type="text" class="form-control" id="title" th:field="*{title}">
			<div class="text-danger" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>
		</div>
		<div class="mb-3">
			<label for="priority" class="form-label">優先度</label>
			<select class="form-select" id="priority" th:field="*{priority}">
				<option th:each="option : ${T(com.example.demo.Priority).values()}"
						th:value="${option}" th:text="${option.displayName}"></option>
			</select>
		</div>
		<div class="mb-3">
			<label for="categoryId" class="form-label">カテゴリ</label>
			<select class="form-select" id="categoryId" th:field="*{categoryId}">
				<option value="">カテゴリなし</option>
				<option th:each="category : ${categories}" th:value="${category.id}"
						th:text="${category.name}"></option>
			</select>
			<div class="text-danger" th:if="${#fields.hasErrors('categoryId')}"
				 th:errors="*{categoryId}"></div>
		</div>
		<div class="mb-3">
			<label for="deadline" class="form-label">期限日</label>
			<input type="date" class="form-control" id="deadline" th:field="*{deadline}">
		</div>
		<div class="mb-3">
			<label for="detail" class="form-label">詳細</label>
			<textarea class="form-control" id="detail" rows="3" th:field="*{detail}"></textarea>
			<div class="text-danger" th:if="${#fields.hasErrors('detail')}" th:errors="*{detail}"></div>
		</div>
		<div class="d-flex gap-2 mt-4">
			<button class="btn btn-primary" type="submit">確認画面へ</button>
			<a class="btn btn-outline-secondary" href="/todo">戻る</a>
		</div>
	</form>
</main>
</body>
</html>
