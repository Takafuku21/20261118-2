<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>ToDo新規登録</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
		  rel="stylesheet"
		  integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
		  crossorigin="anonymous">
</head>
<body>
<main class="container py-5">
	<h1 class="h2 mb-4">ToDo新規登録</h1>

	<form method="post" action="/todo/confirm">
		<div class="mb-3">
			<label for="title" class="form-label">タイトル</label>
			<input type="text" class="form-control" id="title" name="title">
		</div>
		<div class="mb-3">
			<label for="description" class="form-label">説明</label>
			<textarea class="form-control" id="description" name="description" rows="3"></textarea>
		</div>
		<div class="mb-4">
			<label for="done" class="form-label">完了状態</label>
			<select class="form-select" id="done" name="done">
				<option value="false" selected>未完了</option>
				<option value="true">完了</option>
			</select>
		</div>
		<div class="d-flex gap-2">
			<button class="btn btn-primary" type="submit">確認画面へ</button>
			<a class="btn btn-outline-secondary" href="/todo">戻る</a>
		</div>
	</form>
</main>
</body>
</html>
