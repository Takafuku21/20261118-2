<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>ToDo一覧</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
		  rel="stylesheet"
		  integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
		  crossorigin="anonymous">
	<style>
		.completed-row > * {
			background-color: #e9ecef !important;
			color: #6c757d;
		}
		.overdue-row > * {
			background-color: #f8d7da !important;
			color: #842029;
		}
		.warning-row > * {
			background-color: #fff3cd !important;
			color: #664d03;
		}
		#delete-confirmation {
			border: 0;
			border-radius: 0.5rem;
			box-shadow: 0 1rem 3rem rgba(0, 0, 0, 0.2);
			max-width: min(32rem, calc(100% - 2rem));
			padding: 1.5rem;
			width: 100%;
		}
		#delete-confirmation::backdrop {
			background: rgba(0, 0, 0, 0.5);
		}
	</style>
</head>
<body>
<main class="container py-5">
	<div class="d-flex justify-content-between align-items-center mb-4">
		<h1 class="h2 mb-0">ToDo一覧</h1>
		<a class="btn btn-primary" href="/todo/new">新規登録</a>
	</div>

	<div th:if="${successMessage}" class="alert alert-success fade show auto-dismiss-alert" role="status"
		 th:text="${successMessage}"></div>
	<div th:if="${errorMessage}" class="alert alert-danger fade show auto-dismiss-alert" role="alert"
		 th:text="${errorMessage}"></div>

	<form method="get" action="/todo" class="row g-2 align-items-center mb-3">
		<input type="hidden" name="page" value="0">
		<input type="hidden" name="sort" th:value="${sort}">
		<input type="hidden" name="direction" th:value="${direction}">
		<div class="col-sm-8 col-md-4">
			<label for="keyword" class="visually-hidden">タイトルで検索</label>
			<input id="keyword" name="keyword" type="search" class="form-control"
				   placeholder="タイトルで検索" th:value="${keyword}">
		</div>
		<div class="col-sm-8 col-md-4">
			<label for="categoryId" class="visually-hidden">カテゴリで絞り込み</label>
			<select id="categoryId" name="categoryId" class="form-select">
				<option value="">すべてのカテゴリ</option>
				<option th:each="category : ${categories}" th:value="${category.id}"
						th:text="${category.name}"
						th:selected="${categoryId != null and category.id == categoryId}"></option>
			</select>
		</div>
		<div class="col-auto">
			<button type="submit" class="btn btn-primary">検索・絞り込み</button>
		</div>
		<div class="col-auto" th:if="${keyword != null or categoryId != null}">
			<a class="btn btn-outline-secondary"
			   th:href="@{/todo(page=0,sort=${sort},direction=${direction})}">クリア</a>
		</div>
	</form>
	<p class="text-muted mb-3">
		<span th:if="${keyword != null}">検索結果: </span>
		全<span th:text="${page.totalElements}">0</span>件中
		<span th:text="${startItem}">0</span>-<span th:text="${endItem}">0</span>件を表示
	</p>

	<form id="bulk-delete-form" method="post" action="/todo/bulk-delete"
		  class="mb-3" th:if="${!#lists.isEmpty(todos)}">
		<button type="button" id="bulk-delete-trigger" class="btn btn-danger" disabled>
			選択した項目を削除
		</button>
	</form>

	<section th:if="${#lists.isEmpty(todos)}" class="card border-0 shadow-sm bg-light text-center py-5 px-3">
		<div class="card-body">
			<h2 th:if="${keyword != null}" class="h4 card-title mb-3">検索条件に一致するToDoがありません</h2>
			<h2 th:unless="${keyword != null}" class="h4 card-title mb-3">ToDoがまだ登録されていません</h2>
			<p th:unless="${keyword != null}" class="card-text text-muted mb-4">新規作成ボタンから、最初のToDoを登録しましょう。</p>
			<a class="btn btn-primary" href="/todo/new">新規作成</a>
		</div>
	</section>

	<table th:unless="${#lists.isEmpty(todos)}" class="table table-striped table-bordered">
		<thead class="table-light">
		<tr>
			<th scope="col">
				<input id="select-all-todos" type="checkbox" class="form-check-input"
					   aria-label="全選択">
			</th>
			<th scope="col">ID</th>
			<th scope="col">
				<a th:href="@{/todo(page=0,keyword=${keyword},categoryId=${categoryId},sort='title',direction=${nextTitleDirection})}">
					タイトル
					<span th:if="${sort == 'title'}" th:text="${direction == 'asc' ? '▲' : '▼'}"
						  aria-hidden="true"></span>
				</a>
			</th>
			<th scope="col">
				<a th:href="@{/todo(page=0,keyword=${keyword},categoryId=${categoryId},sort='completed',direction=${nextCompletedDirection})}">
					ステータス
					<span th:if="${sort == 'completed'}" th:text="${direction == 'asc' ? '▲' : '▼'}"
						  aria-hidden="true"></span>
				</a>
			</th>
			<th scope="col">
				<a th:href="@{/todo(page=0,keyword=${keyword},categoryId=${categoryId},sort='priority',direction=${nextPriorityDirection})}">
					優先度
					<span th:if="${sort == 'priority'}" th:text="${direction == 'asc' ? '▲' : '▼'}"
						  aria-hidden="true"></span>
				</a>
			</th>
			<th scope="col">カテゴリ</th>
			<th scope="col">
				<a th:href="@{/todo(page=0,keyword=${keyword},categoryId=${categoryId},sort='createdAt',direction=${nextCreatedAtDirection})}">
					作成日
					<span th:if="${sort == 'createdAt'}" th:text="${direction == 'asc' ? '▲' : '▼'}"
						  aria-hidden="true"></span>
				</a>
			</th>
			<th scope="col">
				<a th:href="@{/todo(page=0,keyword=${keyword},categoryId=${categoryId},sort='deadline',direction=${nextDeadlineDirection})}">
					期限日
					<span th:if="${sort == 'deadline'}" th:text="${direction == 'asc' ? '▲' : '▼'}"
						  aria-hidden="true"></span>
				</a>
			</th>
			<th scope="col">操作</th>
		</tr>
		</thead>
		<tbody>
		<tr th:each="todo : ${todos}"
			th:classappend="${todo.completed ? (todo.overdue ? 'completed-row overdue-row' : (todo.nearDeadline ? 'completed-row warning-row' : 'completed-row')) : (todo.overdue ? 'overdue-row' : (todo.nearDeadline ? 'warning-row' : ''))}">
			<td>
				<input type="checkbox" class="form-check-input todo-checkbox" name="ids"
					   th:value="${todo.id}" form="bulk-delete-form"
					   th:attr="aria-label=|${todo.title}を選択|">
			</td>
			<td th:text="${todo.id}"></td>
			<td>
				<span th:text="${todo.title}"
					  th:classappend="${todo.completed} ? 'text-decoration-line-through text-muted' : ''"></span>
			</td>
			<td>
				<span th:if="${todo.completed}" class="badge bg-success">完了</span>
				<span th:unless="${todo.completed}" class="badge bg-secondary">未完了</span>
			</td>
			<td>
				<span class="badge" th:classappend="${todo.priority.cssClass}"
					  th:text="${todo.priority.displayName}">中</span>
			</td>
			<td>
				<span th:if="${todo.category != null}" class="badge text-white"
					  th:style="|background-color: ${todo.category.color};|"
					  th:text="${todo.category.name}"></span>
				<span th:unless="${todo.category != null}" class="text-muted">なし</span>
			</td>
			<td th:text="${todo.createdAt}"></td>
			<td th:if="${todo.deadline != null}"
				th:text="${#temporals.format(todo.deadline, 'yyyy年MM月dd日')}"></td>
			<td th:unless="${todo.deadline != null}" class="text-muted">未設定</td>
			<td>
				<div class="d-flex gap-2">
					<a class="btn btn-outline-primary btn-sm"
					   th:href="@{/todo/{id}/edit(id=${todo.id})}">編集</a>
					<form method="post" th:action="@{/todo/{id}/toggle(id=${todo.id})}">
						<button type="submit" class="btn btn-outline-success btn-sm"
								th:text="${todo.completed} ? '未完了に戻す' : '完了にする'"></button>
					</form>
					<form method="post" th:action="@{/todo/{id}(id=${todo.id})}" class="d-inline">
						<input type="hidden" name="_method" value="delete">
						<button type="button" class="btn btn-danger btn-sm"
								data-delete-trigger th:attr="data-todo-title=${todo.title}">削除</button>
					</form>
				</div>
			</td>
		</tr>
		</tbody>
	</table>

	<nav th:if="${page.totalPages > 1}" aria-label="ページ送り" class="mt-4">
		<ul class="pagination justify-content-center">
			<li class="page-item" th:classappend="${page.first} ? 'disabled' : ''">
				<a th:if="${page.hasPrevious()}" class="page-link"
				   th:href="@{/todo(page=${page.number - 1},keyword=${keyword},categoryId=${categoryId},sort=${sort},direction=${direction})}">前へ</a>
				<span th:unless="${page.hasPrevious()}" class="page-link">前へ</span>
			</li>
			<li th:each="pageNumber : ${#numbers.sequence(0, page.totalPages - 1)}"
				class="page-item" th:classappend="${pageNumber == page.number} ? 'active' : ''">
				<span th:if="${pageNumber == page.number}" class="page-link" aria-current="page"
					  th:text="${pageNumber + 1}">1</span>
				<a th:unless="${pageNumber == page.number}" class="page-link"
				   th:href="@{/todo(page=${pageNumber},keyword=${keyword},categoryId=${categoryId},sort=${sort},direction=${direction})}"
				   th:text="${pageNumber + 1}">1</a>
			</li>
			<li class="page-item" th:classappend="${page.last} ? 'disabled' : ''">
				<a th:if="${page.hasNext()}" class="page-link"
				   th:href="@{/todo(page=${page.number + 1},keyword=${keyword},categoryId=${categoryId},sort=${sort},direction=${direction})}">次へ</a>
				<span th:unless="${page.hasNext()}" class="page-link">次へ</span>
			</li>
		</ul>
	</nav>

	<dialog id="bulk-delete-confirmation" aria-labelledby="bulk-delete-title"
			aria-describedby="bulk-delete-message">
		<h2 id="bulk-delete-title" class="h5">一括削除の確認</h2>
		<p id="bulk-delete-message" class="mb-4">
			選択した<span id="bulk-delete-count"></span>件のToDoを削除しますか？
		</p>
		<div class="d-flex justify-content-end gap-2">
			<button type="button" class="btn btn-outline-secondary" data-cancel-bulk-delete>キャンセル</button>
			<button type="button" id="confirm-bulk-delete" class="btn btn-danger">削除する</button>
		</div>
	</dialog>

	<dialog id="delete-confirmation" aria-labelledby="delete-confirmation-title"
			aria-describedby="delete-confirmation-message">
		<h2 id="delete-confirmation-title" class="h5">削除の確認</h2>
		<p id="delete-confirmation-message" class="mb-4">
			「<span id="delete-target-title"></span>」を本当に削除しますか？
		</p>
		<div class="d-flex justify-content-end gap-2">
			<button type="button" class="btn btn-outline-secondary" data-cancel-delete autofocus>キャンセル</button>
			<button type="button" id="confirm-delete" class="btn btn-danger">削除する</button>
		</div>
	</dialog>
</main>
<script>
	document.querySelectorAll(".auto-dismiss-alert").forEach((alert) => {
		setTimeout(() => {
			alert.classList.remove("show");
			setTimeout(() => alert.remove(), 150);
		}, 3000);
	});

	const deleteDialog = document.getElementById("delete-confirmation");
	const deleteTargetTitle = document.getElementById("delete-target-title");
	let pendingDeleteForm = null;

	document.querySelectorAll("[data-delete-trigger]").forEach((button) => {
		button.addEventListener("click", () => {
			pendingDeleteForm = button.closest("form");
			deleteTargetTitle.textContent = button.dataset.todoTitle;
			deleteDialog.showModal();
		});
	});

	document.querySelector("[data-cancel-delete]").addEventListener("click", () => {
		deleteDialog.close();
	});

	document.getElementById("confirm-delete").addEventListener("click", () => {
		if (!pendingDeleteForm) {
			return;
		}
		const formToSubmit = pendingDeleteForm;
		pendingDeleteForm = null;
		deleteDialog.close();
		formToSubmit.requestSubmit();
	});

	deleteDialog.addEventListener("close", () => {
		pendingDeleteForm = null;
	});

	const bulkDeleteForm = document.getElementById("bulk-delete-form");
	if (bulkDeleteForm) {
		const selectAllCheckbox = document.getElementById("select-all-todos");
		const todoCheckboxes = Array.from(document.querySelectorAll(".todo-checkbox"));
		const bulkDeleteButton = document.getElementById("bulk-delete-trigger");
		const bulkDeleteDialog = document.getElementById("bulk-delete-confirmation");
		const bulkDeleteCount = document.getElementById("bulk-delete-count");

		const updateBulkDeleteSelection = () => {
			const selectedCount = todoCheckboxes.filter((checkbox) => checkbox.checked).length;
			bulkDeleteButton.disabled = selectedCount === 0;
			selectAllCheckbox.checked = selectedCount === todoCheckboxes.length;
			selectAllCheckbox.indeterminate = selectedCount > 0 && selectedCount < todoCheckboxes.length;
		};

		selectAllCheckbox.addEventListener("change", () => {
			todoCheckboxes.forEach((checkbox) => {
				checkbox.checked = selectAllCheckbox.checked;
			});
			updateBulkDeleteSelection();
		});
		todoCheckboxes.forEach((checkbox) => {
			checkbox.addEventListener("change", updateBulkDeleteSelection);
		});

		bulkDeleteButton.addEventListener("click", () => {
			const selectedCount = todoCheckboxes.filter((checkbox) => checkbox.checked).length;
			if (selectedCount === 0) {
				return;
			}
			bulkDeleteCount.textContent = selectedCount;
			bulkDeleteDialog.showModal();
		});
		document.querySelector("[data-cancel-bulk-delete]").addEventListener("click", () => {
			bulkDeleteDialog.close();
		});
		document.getElementById("confirm-bulk-delete").addEventListener("click", () => {
			if (todoCheckboxes.some((checkbox) => checkbox.checked)) {
				bulkDeleteForm.requestSubmit();
			}
		});
	}
</script>
</body>
</html>
