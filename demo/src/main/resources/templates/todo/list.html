<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>ToDo一覧</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
		  rel="stylesheet"
		  integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
		  crossorigin="anonymous">
</head>
<body>
<main class="container py-5">
	<div class="d-flex justify-content-between align-items-center mb-4">
		<h1 class="h2 mb-0">ToDo一覧</h1>
		<a class="btn btn-primary" href="/todo/new">新規登録</a>
	</div>

	<div th:if="${successMessage}" class="alert alert-success fade show auto-dismiss-alert" role="status"
		 th:text="${successMessage}"></div>
	<div th:if="${errorMessage}" class="alert alert-danger fade show auto-dismiss-alert" role="alert"
		 th:text="${errorMessage}"></div>

	<section th:if="${#lists.isEmpty(todos)}" class="card border-0 shadow-sm bg-light text-center py-5 px-3">
		<div class="card-body">
			<h2 class="h4 card-title mb-3">ToDoがまだ登録されていません</h2>
			<p class="card-text text-muted mb-4">新規作成ボタンから、最初のToDoを登録しましょう。</p>
			<a class="btn btn-primary" href="/todo/new">新規作成</a>
		</div>
	</section>

	<table th:unless="${#lists.isEmpty(todos)}" class="table table-striped table-bordered">
		<thead class="table-light">
		<tr>
			<th scope="col">ID</th>
			<th scope="col">タイトル</th>
			<th scope="col">完了状態</th>
			<th scope="col">操作</th>
		</tr>
		</thead>
		<tbody>
		<tr th:each="todo : ${todos}">
			<td th:text="${todo.id}"></td>
			<td>
				<span th:text="${todo.title}"
					  th:classappend="${todo.completed} ? 'text-decoration-line-through text-muted' : ''"></span>
			</td>
			<td th:text="${todo.completed} ? '完了' : '未完了'"></td>
			<td>
				<div class="d-flex gap-2">
					<a class="btn btn-outline-primary btn-sm"
					   th:href="@{/todo/{id}/edit(id=${todo.id})}">編集</a>
					<form method="post" th:action="@{/todo/{id}/toggle(id=${todo.id})}">
						<button type="submit" class="btn btn-outline-success btn-sm"
								th:text="${todo.completed} ? '未完了に戻す' : '完了にする'"></button>
					</form>
					<form method="post" th:action="@{/todo/{id}/delete(id=${todo.id})}"
						  onsubmit="return confirm('本当に削除しますか？');">
						<button type="submit" class="btn btn-danger btn-sm">削除</button>
					</form>
				</div>
			</td>
		</tr>
		</tbody>
	</table>
</main>
<script>
	document.querySelectorAll(".auto-dismiss-alert").forEach((alert) => {
		setTimeout(() => {
			alert.classList.remove("show");
			setTimeout(() => alert.remove(), 150);
		}, 3000);
	});
</script>
</body>
</html>
