<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>ToDo編集</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
		  rel="stylesheet"
		  integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
		  crossorigin="anonymous">
</head>
<body>
<main class="container py-5">
	<h1 class="h2 mb-4">ToDo編集</h1>

	<div th:if="${successMessage}" class="alert alert-success" role="status"
		 th:text="${successMessage}"></div>
	<div th:if="${errorMessage}" class="alert alert-danger" role="alert"
		 th:text="${errorMessage}"></div>

	<form method="post" th:action="@{/todo/{id}/update(id=${todo.id})}">
		<div class="mb-3">
			<label for="title" class="form-label">タイトル</label>
			<input type="text" class="form-control" id="title" name="title" th:value="${todo.title}">
		</div>
		<div class="mb-3">
			<label for="priority" class="form-label">優先度</label>
			<select class="form-select" id="priority" name="priority">
				<option th:each="option : ${T(com.example.demo.Priority).values()}"
						th:value="${option}" th:text="${option.displayName}"
						th:selected="${option == todo.priority}"></option>
			</select>
		</div>
		<div class="mb-3">
			<label for="categoryId" class="form-label">カテゴリ</label>
			<select class="form-select" id="categoryId" name="categoryId">
				<option value="" th:selected="${todo.category == null}">カテゴリなし</option>
				<option th:each="category : ${categories}" th:value="${category.id}"
						th:text="${category.name}"
						th:selected="${todo.category != null and category.id == todo.category.id}"></option>
			</select>
		</div>
		<div class="mb-3">
			<label for="deadline" class="form-label">期限日</label>
			<input type="date" class="form-control" id="deadline" name="deadline"
				   th:value="${todo.deadline != null ? #temporals.format(todo.deadline, 'yyyy-MM-dd') : ''}">
		</div>
		<div class="form-check mb-4">
			<input class="form-check-input" type="checkbox" id="completed" name="completed"
				   value="true" th:checked="${todo.completed}">
			<label for="completed" class="form-check-label">完了</label>
		</div>
		<div class="d-flex gap-2">
			<button class="btn btn-primary" type="submit">更新</button>
			<a class="btn btn-outline-secondary" href="/todo">戻る</a>
		</div>
	</form>

	<section class="mt-5">
		<h2 class="h4">添付ファイル</h2>
		<form method="post" enctype="multipart/form-data"
			  th:action="@{/todo/{id}/attachments(id=${todo.id})}" class="mb-3">
			<div class="mb-3">
				<label for="attachment-file" class="form-label">ファイル（PDF、JPEG、PNG、TXT／10MB以下）</label>
				<input type="file" class="form-control" id="attachment-file" name="file"
					   accept=".pdf,.jpg,.jpeg,.png,.txt,application/pdf,image/jpeg,image/png,text/plain"
					   required>
			</div>
			<button class="btn btn-primary" type="submit">添付</button>
		</form>

		<p th:if="${#lists.isEmpty(attachments)}" class="text-muted">添付ファイルはありません。</p>
		<ul th:unless="${#lists.isEmpty(attachments)}" class="list-group">
			<li th:each="attachment : ${attachments}"
				class="list-group-item d-flex justify-content-between align-items-center gap-3">
				<a th:href="@{/todo/attachments/{id}/download(id=${attachment.id})}"
				   th:text="${attachment.originalFilename}"></a>
				<form method="post"
					  th:action="@{/todo/{todoId}/attachments/{attachmentId}/delete(todoId=${todo.id},attachmentId=${attachment.id})}">
					<button class="btn btn-outline-danger btn-sm" type="submit">削除</button>
				</form>
			</li>
		</ul>
	</section>
</main>
</body>
</html>
