<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>登録内容の確認</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
		  rel="stylesheet"
		  integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
		  crossorigin="anonymous">
</head>
<body>
<main class="container py-5">
	<h1 class="h2 mb-4">登録内容の確認</h1>

	<div class="card mb-4">
		<div class="card-body">
			<h2 class="h5 card-title">タイトル</h2>
			<p class="card-text" th:text="${title}"></p>
			<h2 class="h5 card-title">説明</h2>
			<p class="card-text" th:text="${description}"></p>
			<h2 class="h5 card-title">完了状態</h2>
			<p class="card-text mb-0" th:text="${done} ? '完了' : '未完了'"></p>
		</div>
	</div>

	<div class="d-flex gap-2">
		<a class="btn btn-primary" href="/todo/complete">登録</a>
		<a class="btn btn-outline-secondary" href="/todo/new">戻る</a>
	</div>
</main>
</body>
</html>
