<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>User administration</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<main class="container py-5">
	<div class="d-flex justify-content-between align-items-center mb-4">
		<h1 class="h2">User administration</h1>
		<a class="btn btn-outline-secondary" th:href="@{/todo}">Back to ToDo list</a>
	</div>
	<div th:if="${successMessage}" class="alert alert-success" role="status" th:text="${successMessage}"></div>
	<div th:if="${errorMessage}" class="alert alert-danger" role="alert" th:text="${errorMessage}"></div>
	<div class="table-responsive">
		<table class="table table-striped align-middle">
			<thead><tr><th>Username</th><th>Role and status</th><th>Actions</th></tr></thead>
			<tbody>
			<tr th:each="user : ${users}">
				<td th:text="${user.username}"></td>
				<td colspan="2">
					<form method="post" th:action="@{/admin/users/update}" class="d-flex flex-wrap align-items-center gap-2">
						<input type="hidden" name="id" th:value="${user.id}">
						<label class="visually-hidden" th:for="|role-${user.id}|">Role</label>
						<select class="form-select w-auto" name="role" th:id="|role-${user.id}|">
							<option value="USER" th:selected="${user.role == 'USER'}">USER</option>
							<option value="ADMIN" th:selected="${user.role == 'ADMIN'}">ADMIN</option>
						</select>
						<div class="form-check">
							<input class="form-check-input" type="checkbox" name="enabled" value="true"
								   th:checked="${user.enabled}" th:id="|enabled-${user.id}|">
							<label class="form-check-label" th:for="|enabled-${user.id}|">Enabled</label>
						</div>
						<button class="btn btn-primary btn-sm" type="submit">Save</button>
					</form>
				</td>
			</tr>
			</tbody>
		</table>
	</div>
</main>
</body>
</html>
