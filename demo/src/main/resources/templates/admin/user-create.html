<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Create user</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<main class="container py-5" style="max-width: 38rem">
	<h1 class="h2 mb-4">Create user</h1>
	<div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}" th:each="error : ${#fields.globalErrors()}" th:text="${error}"></div>
	<form method="post" th:action="@{/admin/users/create}" th:object="${registrationForm}">
		<div class="mb-3">
			<label for="username" class="form-label">Username</label>
			<input id="username" class="form-control" type="text" th:field="*{username}" maxlength="100" required autofocus>
			<div class="text-danger" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
		</div>
		<div class="mb-3">
			<label for="password" class="form-label">Password (8 or more characters)</label>
			<input id="password" class="form-control" type="password" th:field="*{password}" minlength="8" required>
			<div class="text-danger" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
		</div>
		<div class="mb-3">
			<label for="confirmPassword" class="form-label">Confirm password</label>
			<input id="confirmPassword" class="form-control" type="password" th:field="*{confirmPassword}" required>
			<div class="text-danger" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
		</div>
		<div class="mb-3">
			<label for="role" class="form-label">Role</label>
			<select id="role" class="form-select" name="role">
				<option value="USER" th:selected="${role == 'USER'}">USER</option>
				<option value="ADMIN" th:selected="${role == 'ADMIN'}">ADMIN</option>
			</select>
		</div>
		<div class="form-check mb-4">
			<input class="form-check-input" type="checkbox" id="enabled" name="enabled" value="true" th:checked="${enabled}">
			<label class="form-check-label" for="enabled">Enabled</label>
		</div>
		<div class="d-flex gap-2">
			<button class="btn btn-primary" type="submit">Create</button>
			<a class="btn btn-outline-secondary" th:href="@{/admin/users}">Cancel</a>
		</div>
	</form>
</main>
</body>
</html>
