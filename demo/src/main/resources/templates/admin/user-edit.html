<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Edit user</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<main class="container py-5" style="max-width: 38rem">
	<h1 class="h2 mb-4">Edit user</h1>
	<div th:if="${errorMessage}" class="alert alert-danger" role="alert" th:text="${errorMessage}"></div>
	<p><strong>Username:</strong> <span th:text="${user.username}"></span></p>
	<form method="post" th:action="@{/admin/users/{id}/edit(id=${user.id})}">
		<div class="mb-3">
			<label for="role" class="form-label">Role</label>
			<select id="role" class="form-select" name="role">
				<option value="USER" th:selected="${user.role == 'USER'}">USER</option>
				<option value="ADMIN" th:selected="${user.role == 'ADMIN'}">ADMIN</option>
			</select>
		</div>
		<div class="form-check mb-4">
			<input class="form-check-input" type="checkbox" id="enabled" name="enabled" value="true" th:checked="${user.enabled}">
			<label class="form-check-label" for="enabled">Enabled</label>
		</div>
		<hr>
		<p class="text-muted">Leave these fields blank to keep the current password.</p>
		<div class="mb-3">
			<label for="newPassword" class="form-label">New password (8 or more characters)</label>
			<input id="newPassword" class="form-control" type="password" name="newPassword" minlength="8" autocomplete="new-password">
		</div>
		<div class="mb-4">
			<label for="confirmPassword" class="form-label">Confirm new password</label>
			<input id="confirmPassword" class="form-control" type="password" name="confirmPassword" autocomplete="new-password">
		</div>
		<div class="d-flex gap-2">
			<button class="btn btn-primary" type="submit">Save changes</button>
			<a class="btn btn-outline-secondary" th:href="@{/admin/users}">Cancel</a>
		</div>
	</form>
</main>
</body>
</html>
