<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>新規登録 | ToDo</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
		  rel="stylesheet"
		  integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
		  crossorigin="anonymous">
</head>
<body class="bg-light">
<main class="container py-5" style="max-width: 28rem">
	<h1 class="h2 mb-4">ToDoユーザー新規登録</h1>
	<form method="post" th:action="@{/register}" th:object="${registrationForm}">
		<div class="mb-3">
			<label for="username" class="form-label">ユーザー名</label>
			<input id="username" type="text" class="form-control" th:field="*{username}"
				   autocomplete="username" maxlength="100" required autofocus>
			<div class="text-danger" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
		</div>
		<div class="mb-3">
			<label for="password" class="form-label">パスワード（8文字以上）</label>
			<input id="password" type="password" class="form-control" th:field="*{password}"
				   autocomplete="new-password" minlength="8" required>
			<div class="text-danger" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
		</div>
		<div class="mb-4">
			<label for="confirmPassword" class="form-label">パスワード（確認）</label>
			<input id="confirmPassword" type="password" class="form-control" th:field="*{confirmPassword}"
				   autocomplete="new-password" required>
			<div class="text-danger" th:if="${#fields.hasErrors('confirmPassword')}"
				 th:errors="*{confirmPassword}"></div>
		</div>
		<button type="submit" class="btn btn-primary w-100">アカウントを作成</button>
	</form>
	<p class="text-center mt-3 mb-0"><a th:href="@{/login}">ログイン画面へ戻る</a></p>
</main>
</body>
</html>
