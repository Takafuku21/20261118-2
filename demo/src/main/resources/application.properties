spring.application.name=demo
spring.datasource.url=jdbc:h2:mem:tododb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.sql.init.mode=always
spring.mvc.hiddenmethod.filter.enabled=true
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.configuration.map-underscore-to-camel-case=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
app.security.bootstrap.username=${TODO_BOOTSTRAP_USERNAME:}
app.security.bootstrap.password=${TODO_BOOTSTRAP_PASSWORD:}
app.file-storage-dir=${FILE_STORAGE_DIR:./uploads}
app.virus-scanner.clamav.host=${CLAMAV_HOST:127.0.0.1}
app.virus-scanner.clamav.port=${CLAMAV_PORT:3310}
app.virus-scanner.clamav.timeout-millis=${CLAMAV_TIMEOUT_MILLIS:30000}
